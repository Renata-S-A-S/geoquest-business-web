<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10262B" />
    <title>GeoQuest — Portal de Negocios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap"
    />
    <script id="theme-bootstrap">
      // Bootstrap de pre-paint, síncrono, deliberadamente SIN type="module":
      // un script de módulo se difiere y correría después del primer paint,
      // produciendo un destello del tema incorrecto. `zustand/persist`
      // rehidrata recién después de que React monta, así que no puede ser
      // dueño de esto — a esa altura la página ya pintó con el tema
      // equivocado. La forma de abajo es la salida exacta de
      // `createJSONStorage` de `zustand/middleware` (verificada en
      // node_modules): `JSON.stringify({ state: partialize(get()), version })`.
      // `version` se IGNORA a propósito: `mode` se valida contra el union
      // literal en su lugar, así que cualquier forma persistida futura o
      // desconocida degrada a "system" en vez de lanzar antes del primer
      // paint. Mantenido sincronizado con src/shared/lib/theme.ts por la
      // guardia contra divergencia en src/test/theme-bootstrap.dom.test.ts.
      ;(function () {
        try {
          var mode = 'system'
          var raw = localStorage.getItem('geoquest-business.theme')
          if (raw) {
            var persisted = JSON.parse(raw)
            var value = persisted && persisted.state && persisted.state.mode
            if (value === 'light' || value === 'dark' || value === 'system') mode = value
          }
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              typeof matchMedia === 'function' &&
              matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0A1618' : '#F6F3EC')
        } catch (error) {
          // Storage bloqueado (modo privado / cookies deshabilitadas) o JSON
          // corrupto — cae al default claro en vez de bloquear el primer
          // paint.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
